# Dev stack: Postgres (pgvector), Redis, API, queue worker, web.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api: &server
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: server/.env
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "npm run db:setup && exec node --import tsx src/api/index.ts" # exec: the API gets SIGTERM directly and shuts down cleanly
    ports: ["4000:4000"]

  worker:
    <<: *server
    command: node --import tsx src/worker.ts # one process, so SIGTERM reaches the shutdown handler
    ports: []
    restart: on-failure # retries until the api's db:setup has created the tables

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    environment:
      VITE_API_PROXY: http://api:4000
    depends_on: [api]
    ports: ["5173:5173"]

volumes:
  pgdata:
