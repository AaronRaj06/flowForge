server {
  listen 80;
  client_max_body_size 12m; # knowledge-base uploads are capped at 10 MB

  root /usr/share/nginx/html;
  location / {
    try_files $uri /index.html; # client-side routes
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API, public webhook/REST endpoints, forms and approval links all live on the api service.
  location ~ ^/(api|webhooks|forms|approvals)(/|$) {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-sent events (live run updates) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
