server {
  listen 80;
  client_max_body_size 12m; # knowledge-base uploads are capped at 10 MB

  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # HSTS belongs on the TLS terminator in front of this container (load balancer or Caddy/Traefik).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  root /usr/share/nginx/html;
  location / {
    try_files $uri /index.html; # client-side routes
    add_header Cache-Control "no-cache" always; # always pick up a new build's index.html
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # API, public webhook/REST endpoints, forms and approval links all live on the api service.
  location ~ ^/(api|webhooks|forms|approvals)(/|$) {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-sent events (live run updates) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
